name: Build CCS Toolface App

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1
  SERIOUS_PYTHON_VERSION: 3.12  # 👈 确保这一行存在且拼写正确

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            build_cmd: "flet build windows"
            artifact_path: build/windows
            needs_linux_deps: false
          - name: apk
            runner: ubuntu-latest
            build_cmd: "flet build apk"
            artifact_path: build/apk
            needs_linux_deps: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.name == 'apk'
        uses: android-actions/setup-android@v4.0.4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install -y --no-install-recommends \
              libgtk-3-dev libblkid-dev liblzma-dev libstdc++-12-dev \
              mesa-utils libegl1 pkg-config ninja-build cmake clang
            sudo apt-get clean

      - name: Build app
        shell: bash
        run: |
          # 显式传递 --python-version 参数，确保万无一失
          uv run ${{ matrix.build_cmd }} --python-version 3.12 --yes --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-build
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false
