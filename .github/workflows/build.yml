name: Build CCS Toolface App

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # -------- Android --------
          - name: apk
            runner: ubuntu-latest
            # 强制使用 3.12，避免版本过新导致底层库编译失败
            build_cmd: "flet build apk --python-version 3.12"
            artifact_path: build/apk
            needs_linux_deps: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Install Linux dependencies
        shell: bash
        run: |
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install -y --no-install-recommends \
              libgtk-3-dev libblkid-dev liblzma-dev libstdc++-12-dev \
              mesa-utils libegl1 pkg-config ninja-build cmake clang
            sudo apt-get clean

      - name: Build app
        shell: bash
        # 👇 关键改动：把日志同时输出到屏幕和文件，且即使报错也继续执行
        run: |
          set -o pipefail
          uv run ${{ matrix.build_cmd }} --yes --verbose 2>&1 | tee build_output.log || true
          
      # 👇 如果构建失败，将日志作为附件上传
      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: build_output.log
